version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mausamsetu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mausamsetu
      POSTGRES_USER: mausamsetu
      POSTGRES_PASSWORD: mausamsetu_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mausamsetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mausamsetu_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mausamsetu:mausamsetu_dev@db:5432/mausamsetu
      SECRET_KEY: dev_secret_key_change_in_production
      ENVIRONMENT: development
      OPENMETEO_BASE_URL: https://api.open-meteo.com/v1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mausamsetu_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
